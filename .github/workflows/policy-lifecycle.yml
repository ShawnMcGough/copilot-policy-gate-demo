name: Policy check lifecycle
on:
  workflow_run:
    workflows: [Copilot policy analysis]
    types: [in_progress, completed]
permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: write
concurrency:
  group: policy-lifecycle-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Finalize completed analysis and invalidate previous rerun attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/gate.py lifecycle
